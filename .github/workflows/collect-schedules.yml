name: Collect and publish official schedules

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: Backfill start date (YYYY-MM-DD); leave both dates empty for daily collection
        required: false
        type: string
      backfill_to:
        description: Backfill end date (YYYY-MM-DD); leave both dates empty for daily collection
        required: false
        type: string

concurrency:
  group: collect-official-schedules
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:collector
      - name: Download current event history
        env:
          SCHEDULE_API_URL: ${{ secrets.SCHEDULE_API_URL }}
        run: npm run api:pull
      - name: Validate backfill inputs
        if: ${{ (inputs.backfill_from == '') != (inputs.backfill_to == '') }}
        run: exit 1
      - name: Start temporary SearXNG
        if: ${{ inputs.backfill_from == '' && inputs.backfill_to == '' }}
        run: |
          docker run --detach --name schedule-searxng \
            --publish 127.0.0.1:8080:8080 \
            --volume "$GITHUB_WORKSPACE/config/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            ghcr.io/searxng/searxng:latest

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:8080/search?q=healthcheck&format=json" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs schedule-searxng
          exit 1
      - name: Collect hourly
        if: ${{ inputs.backfill_from == '' && inputs.backfill_to == '' }}
        env:
          SEARCH_ENGINE_URL: http://127.0.0.1:8080
        run: xvfb-run -a npm run collect
      - name: Stop temporary SearXNG
        if: ${{ always() && inputs.backfill_from == '' && inputs.backfill_to == '' }}
        continue-on-error: true
        run: docker rm --force schedule-searxng
      - name: Preview requested backfill
        if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        env:
          BACKFILL_MAX_PAGES: 5
          BACKFILL_PAGE_SIZE: 30
        run: xvfb-run -a npm run collect:backfill -- --from=${{ inputs.backfill_from }} --to=${{ inputs.backfill_to }}
      - name: Write requested backfill
        if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        env:
          BACKFILL_MAX_PAGES: 5
          BACKFILL_PAGE_SIZE: 30
        run: xvfb-run -a npm run collect:backfill -- --from=${{ inputs.backfill_from }} --to=${{ inputs.backfill_to }} --write
      - name: Publish through the authenticated API
        env:
          SCHEDULE_API_URL: ${{ secrets.SCHEDULE_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: npm run api:publish
