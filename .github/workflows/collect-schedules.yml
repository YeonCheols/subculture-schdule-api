name: Collect and publish official schedules

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

concurrency:
  group: collect-official-schedules
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:collector
      - name: Collect and publish at 00:10 KST
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: xvfb-run -a npm run collect:publish
